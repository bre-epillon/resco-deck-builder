# DBTOT (Dubai total), DBPRO and DBTRT were added 2026-10-22: Summary_<CODE> sheets, ResClass sheets and Expert Judgement blocks exist in v2.13b.
# The Q3 template v1 has DBTOT slides (an empty Results slide: its pictures are inserted by the build) and no DBPRO / DBTRT slide yet.

# Mismatches between the legacy (Q2) control sheet and the deck (ReservingPresentation_202609.pptx), and how they were resolved.
# The deck is the source of truth for which slides exist.
mismatch:
  - "DCFIL, DCMAR: legacy flags said no triangles/patterns/EJ, but the deck has them. Flags corrected to true here."
  - "DBENR, DBLIF: deck only has a Results slide with the table image (no P&L image). Nothing else is written for them."
  - "DBLIF: no ExpertJudgement block exists in v2.13 (row 185 is past the end of the sheet): ej_first_row set to null. The scan raises an ERROR if a deck ever gets a DBLIF EJ slide."
  - "DCFRO, DCPRO, DCENR, DCSPE, DCLIA: in the legacy control sheet, no slides in the deck (reported as info by the scan)."
  - "ENOTH: has an ExpertJudgement block (rows 35-44) but is in neither the control sheet nor the deck."
  - "Pattern charts: legacy found them by name (missing/duplicated in v2.13); the tool finds them by title, duplicates ignored (confirmed 2026-10-20)."
