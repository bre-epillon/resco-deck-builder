# NOTE: the boolean flags below are LEGACY and informational. The deck decides what is produced
# (see slides.yaml / `resco scan`). The tool relies on: selector, resclass (also the key of the Expert Judgement block,
# which is FOUND BY THIS CODE in the workbook). ej_first_row is documentation only since 2026-10-21.
#
# Source: 'PrintPNGs' control sheet of Print tables.xlsm (rows 8-29), as saved for the Q2 run
# (workbook ABE&MBE_202606_v2.9b, max year 2026). Status: DRAFT. The control sheet is NOT yet confirmed
# to be current for Q3; mismatches versus the Q2 deck are listed under `mismatch`.
#
# selector     = value written to ResCo tables_new!B1
# resclass     = sheet holding the pattern charts / key into ExpertJudgement (blank for totals)
# table / triangles / profit / charts_triangles / patterns / exp_judgement = legacy flags
# ej_first_row = first row of the LoB's block in ExpertJudgement (10-row blocks, header row 4)
# single_slide = legacy scratch-deck behaviour only (Y = each image on its own scratch slide); irrelevant for in-place replacement

lobs:
  - {selector: Summary_ALL,   resclass: "",      table: true, triangles: true,  profit: true,  charts_triangles: true,  patterns: false, exp_judgement: false, ej_first_row: null, single_slide: Y}
